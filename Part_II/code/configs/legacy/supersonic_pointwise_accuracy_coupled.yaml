    rtol: 1.0e-10
    atol: 1.0e-12
  - label: medium_1
    max_step: 1.0
    rtol: 1.0e-10
    atol: 1.0e-12
  - label: fine_0p5
    max_step: 0.5
    rtol: 1.0e-10
