version: 1
sweep:
  name: supersonic_pointwise_box
  type: shooting_box
  cases:
    - supersonic_M110
    - supersonic_M120
    - supersonic_M130
    - supersonic_M140
    - supersonic_M150
    - supersonic_M160
    - supersonic_M170
    - supersonic_M180
    - supersonic_M190
  solver_by_regime:
    supersonic: supersonic_shooting
  Ly_multipliers: [0.5, 0.75, 1.0, 1.25]
  reference_policy: largest_Ly_same_case
  fixed_accuracy_by_regime:
    supersonic: {rtol: 1.0e-10, atol: 1.0e-12, max_step: 0.25}
  modal_diagnostics: &modal_diagnostics
    assembly_y: zero
    window_half_width: 0.25
    relative_p_window_error_max: 1.0e-3
    relative_py_window_error_max: 1.0e-3
    relative_p_jump_max: 1.0e-3
    relative_py_jump_max: 1.0e-3
    require_finite_fields: true
    require_nondegenerate_fields: true
    nondegenerate_min_peak: 1.0e-12
    core_thresholds: [1.0e-3]
  produce_modes: true
