version: 1
sweep:
  name: subsonic_pointwise_accuracy_resolution_coupled
  type: shooting_accuracy
  cases:
  - subsonic_M010
  - subsonic_M020
  - subsonic_M030
  - subsonic_M040
  - subsonic_M050
  - subsonic_M060
  - subsonic_M070
  - subsonic_M080
  - subsonic_M090
  solver_by_regime:
    subsonic: subsonic_mstab17
  levels_by_regime:
    subsonic:
    - label: coarse_1e-6
      rtol: 1.0e-06
      atol: 1.0e-08
    - label: standard_1e-8
      rtol: 1.0e-08
      atol: 1.0e-10
    - label: strict_1e-10
      rtol: 1.0e-10
      atol: 1.0e-12
    - label: reference_1e-12
      rtol: 1.0e-12
      atol: 1.0e-14
  reference_policy: smallest_tolerances_same_case
  fixed_Ly_by_regime:
    subsonic: 80.0
  fixed_resolution_by_regime:
    subsonic:
      n_mode_points: 4001
      physical_dy: 0.04
      max_step: 0.25
  modal_diagnostics:
    core_thresholds:
    - 0.001
  produce_modes: true
