[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-supersonic-reference"
dynamic = ["version"]
description = "Classical supersonic Kelvin-Helmholtz spectral and modal reference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pypdf>=4",
    "build>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "classic_supersonic_reference.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
