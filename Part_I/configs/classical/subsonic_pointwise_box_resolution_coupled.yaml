version: 1
sweep:
  name: subsonic_pointwise_box_resolution_coupled
  type: shooting_box
  cases:
  - subsonic_M010
  - subsonic_M020
  - subsonic_M030
  - subsonic_M040
  - subsonic_M050
  - subsonic_M060
  - subsonic_M070
  - subsonic_M080
  - subsonic_M090
  solver_by_regime:
    subsonic: subsonic_mstab17
  levels_by_regime:
    subsonic:
    - label: Ly40_constant_dy
      Ly: 40.0
      n_mode_points: 2001
      physical_dy: 0.04
    - label: Ly60_constant_dy
      Ly: 60.0
      n_mode_points: 3001
      physical_dy: 0.04
    - label: Ly80_constant_dy
      Ly: 80.0
      n_mode_points: 4001
      physical_dy: 0.04
    - label: Ly100_constant_dy
      Ly: 100.0
      n_mode_points: 5001
      physical_dy: 0.04
  reference_policy: largest_Ly_same_case_at_constant_physical_dy
  fixed_accuracy_by_regime:
    subsonic:
      rtol: 1.0e-10
      atol: 1.0e-12
      max_step: 0.25
  modal_diagnostics:
    core_thresholds:
    - 0.001
  produce_modes: true
