version: 1
sweep:
  name: subsonic_pointwise_box_direct
  type: shooting_box
  cases:
  - subsonic_M010
  - subsonic_M020
  - subsonic_M030
  - subsonic_M040
  - subsonic_M050
  - subsonic_M060
  - subsonic_M070
  - subsonic_M080
  - subsonic_M090
  solver_by_regime:
    subsonic: subsonic_mstab17
  Ly_multipliers:
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  reference_policy: largest_Ly_same_case
  fixed_accuracy_by_regime:
    subsonic:
      rtol: 1.0e-10
      atol: 1.0e-12
      max_step: null
  modal_diagnostics:
    core_thresholds:
    - 0.001
  produce_modes: true
