name: Lightweight repository checks

on:
  push:
  pull_request:

jobs:
  part-i:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only test dependencies
        run: python -m pip install pytest numpy scipy pandas Pillow

      - name: Compile public Python entry points
        run: python -m compileall -q Part_I/code Part_I/experiments Part_I/tests

      - name: Run lightweight CPU tests
        working-directory: Part_I
        run: python -m pytest -q tests

  part-ii:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only test dependencies
        run: python -m pip install Pillow pytest

      - name: Compile public Python entry points
        run: python -m compileall -q Part_II/code Part_II/experiments Part_II/tests

      - name: Run lightweight CPU tests
        working-directory: Part_II
        run: python -m pytest -q tests
